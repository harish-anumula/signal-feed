<!doctype html>
<html><head><meta charset="utf-8"><title>Home / X (fixture)</title>
<style>
  body { margin: 0; background: #fff; color: #0f1419; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: 600px; margin: 0 auto; border-inline: 1px solid #eff3f4; }
  article { display: block; padding: 12px 16px; border-bottom: 1px solid #eff3f4; cursor: pointer; }
  .name { font-weight: 700; } .handle { color: #536471; }
  [data-testid="tweetText"] { margin-top: 4px; white-space: pre-wrap; }
  .actions { margin-top: 10px; color: #536471; font-size: 13px; display: flex; gap: 48px; }
</style></head>
<body><main id="feed"></main>
<script>
const posts = [
  ["noise", "Reply guy", "@replyguy", "Like and RT if you agree!!! Follow me for more 🔥🔥🔥 Drop a 💯 below"],
  ["useful", "Systems Notes", "@sysnotes", "We cut p99 latency of our Postgres-backed queue from 900 ms to 40 ms. The fix: SKIP LOCKED plus a partial index on (status, run_at). Write-up with the query plans and the benchmark script in the thread."],
  ["noise", "Outrage Daily", "@outrage", "These people are DISGUSTING and you should be FURIOUS. Absolute clowns, every single one of them. Share before they delete it!"],
  ["useful", "ML Reading", "@mlreading", "New paper compares GRPO and PPO on math reasoning at 1.5B and 7B. Same compute budget, 3 seeds each. GRPO wins at 1.5B, the gap closes at 7B, and both collapse without a KL term. Tables and code linked."],
  ["noise", "Hype Machine", "@hypemachine", "This changes EVERYTHING. The future is here. Nothing will ever be the same. 🚀🚀🚀"],
  ["useful", "Climbing Coach", "@climbcoach", "Three finger-strength protocols compared over 8 weeks with 24 climbers: max hangs gained 11%, repeaters 7%, no-hangs 9% with half the skin wear. Data sheet and the session plans are public."],
  ["noise", "Giveaway Bot", "@freeprizes", "🎁 GIVEAWAY 🎁 Win a free iPhone! Follow, like, retweet and tag 3 friends. Winner in 24h!!"],
  ["useful", "Frontend Field Notes", "@fefield", "TIL: content-visibility: auto on long lists cut our initial render from 1.8 s to 0.6 s on a mid-range Android. Caveat: you need contain-intrinsic-size or the scrollbar jumps. Repro repo in replies."],
  ["noise", "Meme Lord", "@memelord", "me when the coffee kicks in 💀💀💀 lmaooo"],
  ["useful", "Infra Weekly", "@infraweekly", "Postmortem: a single misconfigured retry policy turned a 2-minute DNS blip into a 40-minute outage. Timeline, the exact config diff, and the three guardrails we added afterwards."],
  ["noise", "Engagement Farm", "@engfarm", "Reply with your age and I'll guess your salary 👇👇 (99% accurate)"],
  ["useful", "Data Engineering", "@dataeng", "Benchmark: Parquet with ZSTD level 3 gave the best size/speed trade-off on our 2 TB event table, 38% smaller than Snappy with 6% slower scans. Full matrix of codecs and row-group sizes attached."]
];
const feed = document.getElementById("feed");
window.__clicks = 0;
for (const [kind, name, handle, text] of posts) {
  const a = document.createElement("article");
  a.setAttribute("data-testid", "tweet");
  a.dataset.kind = kind;
  a.innerHTML = `<div><span class="name"></span> <span class="handle"></span></div><div data-testid="tweetText"></div><div class="actions"><span>💬 12</span><span>🔁 4</span><span>♥ 88</span></div>`;
  a.querySelector(".name").textContent = name;
  a.querySelector(".handle").textContent = handle;
  a.querySelector('[data-testid="tweetText"]').textContent = text;
  a.addEventListener("click", () => { window.__clicks += 1; });
  feed.appendChild(a);
}
</script></body></html>
